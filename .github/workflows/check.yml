name: Проверка текстов

on:
  pull_request:
    paths: ['texts/**', 'scripts/**']
  push:
    branches: [main]
    paths: ['texts/**', 'scripts/**']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ширина и число строк
        run: |
          out=$(python3 scripts/check_all.py)
          echo "$out"
          echo "$out" | tail -1 | grep -q "problems: 0"
